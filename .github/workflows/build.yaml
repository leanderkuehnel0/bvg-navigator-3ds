name: Build 3DS application

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build BVG Navigator
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: make -j$(nproc)

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: bvg-navigator
          path: |
            bvg-navigator.3dsx
            bvg-navigator.smdh

