name: Build 3DS application

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build BVG Navigator
    runs-on: ubuntu-latest

    permissions:
      contents: write

    container:
      image: devkitpro/devkitarm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: make -j$(nproc)

      - name: Publish .3dsx as rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build (main)
          body: |
            Automatically built from the `main` branch.

            Install by copying `bvg-navigator.3dsx` to the `3ds` folder of your SD card and launching it from a homebrew launcher (e.g. FBI or the Homebrew Launcher).
          files: |
            bvg-navigator.3dsx
            bvg-navigator.smdh
          fail_on_unmatched_files: true
          allowUpdates: true
          makeLatest: true
          generate_release_notes: false